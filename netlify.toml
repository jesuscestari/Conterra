[build]
  publish = "dist"
  command = "npm run build"

[build.environment]
  # 22 es lo que pide el cliente de Prisma. En 18 el build falla.
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # El cliente de Prisma se genera fuera de la carpeta de funciones, asi que hay
  # que incluirlo a mano en el paquete que se despliega.
  included_files = ["src/generated/prisma/**"]

# Las rutas /api las declara cada funcion con `config.path`, que Netlify resuelve
# antes que los redirects de este archivo. No hace falta mapearlas a mano.

# SPA routing - all routes go to index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security and performance
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Cache images
[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable" 